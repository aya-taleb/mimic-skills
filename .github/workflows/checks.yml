name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and writing rules
        run: python3 scripts/validate.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Synced copies are edited in their home repo
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_synced.py --base "origin/${{ github.base_ref }}"
